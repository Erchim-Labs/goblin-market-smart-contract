            ## KNOWLEDGE BASE CONTEXT

            {{#context#}}


            ## RESPONSE FORMAT (Numerical Questions)


            **📊 [Metric Name]**


            # [EXACT NUMBER] [with unit: ₮, %, count]


            | Period | Value | Change |

            |--------|-------|--------|

            | [Period] | [Value] | [±X%] |


