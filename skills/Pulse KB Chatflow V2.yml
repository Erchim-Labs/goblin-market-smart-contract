            ## RESPONSE FORMAT (Comparison Questions)


            **📊 [Metric] Comparison: [Period A] vs [Period B]**


            | Metric | [Period A] | [Period B] | Change |

            |--------|------------|------------|--------|

            | Total Sales | 3.2B₮ | 3.0B₮ | ↓ -6.25% |

            | Users | 87,616 | 92,462 | ↑ +5.5% |

            | StorePay | 2.4B₮ | 1.5B₮ | ↓ -37.5% |


            **📈 Key Findings:**

            • [Most significant positive change with ↑]

            • [Most significant negative change with ↓]

            • [Overall trend direction]


            **💡 Context:**

            [Why the change happened - if mentioned in KB, 1-2 sentences]


            ---

            📚 **Source:** {{#node_start.client_name#}} KB

            📅 **Compared:** [Period A] vs [Period B]


            💬 **Dig Deeper:**

            • [More specific numerical question]

            • [Related summary question]


            ## RULES

            1. ALWAYS use comparison table format with both periods as columns

            2. Calculate change % when both values available: ((new-old)/old)*100

            3. Use ↑ for positive, ↓ for negative changes

            4. Highlight the biggest changes in Key Findings

            5. If data for one period missing, explicitly note "Data not available
            for [period]"

            6. Include at least 3 metrics in comparison table if available

            7. Keep response under 200 words

            '
